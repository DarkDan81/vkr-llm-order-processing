<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1180" viewBox="0 0 1840 1180" role="img"><title>TO-BE: черновик, подтверждение и передача через Bitrix</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#334155"/></marker><marker id="open" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1840" height="1180" fill="white"/><text x="920.0" y="36" font-family="Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle" fill="#172033"><tspan x="920.0" dy="0">TO-BE: черновик, подтверждение и передача через Bitrix</tspan></text><rect x="30" y="80" width="1780" height="110" rx="0" fill="white" stroke="#334155" stroke-width="1.6"/><rect x="30" y="80" width="40" height="110" rx="0" fill="#e2e8f0" stroke="#334155" stroke-width="1.6"/><text transform="translate(56,135.0) rotate(-90)" font-family="Arial" font-size="18" text-anchor="middle" fill="#172033">Клиент</text><text x="910" y="125" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="910" dy="0">Текст заказа → ответы на уточнения → подтверждение итоговой версии</tspan></text><text x="910" y="158" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="910" dy="0">Клиент не обязан знать SKU и формат учётной системы</tspan></text><rect x="30" y="260" width="1780" height="840" rx="0" fill="white" stroke="#334155" stroke-width="1.6"/><rect x="30" y="260" width="40" height="840" rx="0" fill="#e2e8f0" stroke="#334155" stroke-width="1.6"/><text transform="translate(56,680.0) rotate(-90)" font-family="Arial" font-size="18" text-anchor="middle" fill="#172033">Предприятие</text><rect x="70" y="260" width="1740" height="380" rx="0" fill="white" stroke="#334155" stroke-width="1.6"/><rect x="70" y="260" width="32" height="380" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="1.6"/><text transform="translate(91,450.0) rotate(-90)" font-family="Arial" font-size="16" text-anchor="middle" fill="#172033">Сервис бота</text><rect x="70" y="640" width="1740" height="210" rx="0" fill="white" stroke="#334155" stroke-width="1.6"/><rect x="70" y="640" width="32" height="210" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="1.6"/><text transform="translate(91,745.0) rotate(-90)" font-family="Arial" font-size="16" text-anchor="middle" fill="#172033">Оператор</text><rect x="70" y="850" width="1740" height="250" rx="0" fill="white" stroke="#334155" stroke-width="1.6"/><rect x="70" y="850" width="32" height="250" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="1.6"/><text transform="translate(91,975.0) rotate(-90)" font-family="Arial" font-size="16" text-anchor="middle" fill="#172033">Интеграция</text><circle cx="125" cy="350" r="20" fill="white" stroke="#334155" stroke-width="1.8"/><rect x="114" y="343" width="22" height="14" rx="0" fill="white" stroke="#334155" stroke-width="1.6"/><path d="M114,343 L125,351 L136,343" fill="none" stroke="#334155"/><text x="125" y="393" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="125" dy="0">Заказ</tspan></text><rect x="180" y="310" width="150" height="78" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.6"/><text x="255.0" y="344.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="255.0" dy="0">Проверить</tspan><tspan x="255.0" dy="21.76">клиента</tspan></text><rect x="365" y="310" width="180" height="78" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.6"/><text x="455.0" y="344.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="455.0" dy="0">Разобрать текст</tspan><tspan x="455.0" dy="21.76">и проверить JSON</tspan></text><path d="M595,323 L622,350 L595,377 L568,350 Z" fill="#fffbeb" stroke="#334155" stroke-width="1.6"/><text x="595" y="357" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="595" dy="0">×</tspan></text><text x="595" y="308" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="595" dy="0">Разбор валиден?</tspan></text><rect x="675" y="310" width="180" height="78" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.6"/><text x="765.0" y="344.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="765.0" dy="0">Поиск и проверка</tspan><tspan x="765.0" dy="21.76">атрибутов</tspan></text><path d="M910,323 L937,350 L910,377 L883,350 Z" fill="#fffbeb" stroke="#334155" stroke-width="1.6"/><text x="910" y="357" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="910" dy="0">×</tspan></text><text x="910" y="308" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="910" dy="0">Строки готовы?</tspan></text><rect x="980" y="310" width="160" height="78" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.6"/><text x="1060.0" y="344.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="1060.0" dy="0">Заполнить</tspan><tspan x="1060.0" dy="21.76">реквизиты</tspan></text><rect x="1180" y="310" width="230" height="78" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.6"/><text x="1295.0" y="344.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="1295.0" dy="0">Показать итог и</tspan><tspan x="1295.0" dy="21.76">получить подтверждение</tspan></text><rect x="1445" y="310" width="190" height="78" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.6"/><text x="1540.0" y="344.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="1540.0" dy="0">Проверить версию,</tspan><tspan x="1540.0" dy="21.76">цены и остатки</tspan></text><path d="M1695,323 L1722,350 L1695,377 L1668,350 Z" fill="#fffbeb" stroke="#334155" stroke-width="1.6"/><text x="1695" y="357" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="1695" dy="0">×</tspan></text><text x="1695" y="308" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="1695" dy="0">Можно отправить?</tspan></text><rect x="675" y="520" width="190" height="78" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.6"/><text x="770.0" y="554.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="770.0" dy="0">Уточнить строку</tspan><tspan x="770.0" dy="21.76">у клиента</tspan></text><path d="M980,533 L1007,560 L980,587 L953,560 Z" fill="#fffbeb" stroke="#334155" stroke-width="1.6"/><text x="980" y="567" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="980" dy="0">×</tspan></text><text x="980" y="518" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="980" dy="0">Нужен оператор?</tspan></text><rect x="1050" y="710" width="260" height="78" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.6"/><text x="1180.0" y="744.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="1180.0" dy="0">Разобрать исключение</tspan><tspan x="1180.0" dy="21.76">и предложить исправление</tspan></text><rect x="1500" y="520" width="240" height="78" rx="10" fill="#ecfdf5" stroke="#334155" stroke-width="1.6"/><text x="1620.0" y="554.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="1620.0" dy="0">Подтвердить + outbox</tspan><tspan x="1620.0" dy="21.76">одной транзакцией</tspan></text><rect x="1485" y="900" width="260" height="78" rx="10" fill="#ecfdf5" stroke="#334155" stroke-width="1.6" stroke-dasharray="8 5"/><text x="1615.0" y="934.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="1615.0" dy="0">Создать заказ в Bitrix</tspan><tspan x="1615.0" dy="21.76">с постоянным ключом</tspan></text><path d="M1290,913 L1317,940 L1290,967 L1263,940 Z" fill="#fffbeb" stroke="#334155" stroke-width="1.6"/><text x="1290" y="947" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="1290" dy="0">×</tspan></text><text x="1290" y="898" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="1290" dy="0">Ответ успешен?</tspan></text><rect x="1000" y="900" width="210" height="78" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.6"/><text x="1105.0" y="934.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="1105.0" dy="0">Штатный обмен</tspan><tspan x="1105.0" dy="21.76">Bitrix → 1С</tspan></text><circle cx="905" cy="940" r="20" fill="white" stroke="#334155" stroke-width="4"/><text x="905" y="983" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="905" dy="0">Внешний заказ</tspan></text><rect x="1190" y="1010" width="250" height="60" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.6" stroke-dasharray="8 5"/><text x="1315.0" y="1035.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="1315.0" dy="0">Сохранить задачу</tspan><tspan x="1315.0" dy="21.76">для повтора / разбора</tspan></text><circle cx="1510" cy="1040" r="20" fill="white" stroke="#334155" stroke-width="4"/><text x="1510" y="1083" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="1510" dy="0">Ожидает передачи</tspan></text><polyline points="145,350 180,350" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="330,350 365,350" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="545,350 568,350" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="622,350 675,350" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="855,350 883,350" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="937,350 980,350" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1140,350 1180,350" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1410,350 1445,350" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1635,350 1668,350" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><text x="645" y="334" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="645" dy="0">Да</tspan></text><text x="959" y="334" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="959" dy="0">Да</tspan></text><polyline points="595,377 595,675 1100,675 1100,710" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><text x="615" y="453" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="615" dy="0">Нет / сбой API</tspan></text><polyline points="910,377 910,560 865,560" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><text x="934" y="460" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="934" dy="0">Нет</tspan></text><polyline points="865,577 953,577 953,560" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="980,587 980,748 1050,748" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><text x="1002" y="658" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="1002" dy="0">Да</tspan></text><polyline points="980,533 980,435 765,435 765,388" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><text x="866" y="427" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="866" dy="0">Нет: повторить поиск</tspan></text><polyline points="1310,748 1370,748 1370,460 800,460 800,388" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><text x="1205" y="450" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="1205" dy="0">Исправление → проверка → новая сводка</tspan></text><polyline points="1695,377 1695,520" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><text x="1720" y="454" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="1720" dy="0">Да</tspan></text><polyline points="1695,323 1695,285 1295,285 1295,310" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><text x="1510" y="279" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="1510" dy="0">Нет: обновить итог</tspan></text><polyline points="1620,598 1620,900" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1485,940 1317,940" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1263,940 1210,940" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><text x="1233" y="925" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="1233" dy="0">Да</tspan></text><polyline points="1000,940 925,940" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1290,967 1290,1010" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><text x="1319" y="990" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="1319" dy="0">Нет</tspan></text><polyline points="1440,1040 1490,1040" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="125,190 125,330" fill="none" stroke="#334155" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#open)"/><circle cx="125" cy="190" r="3.5" fill="white" stroke="#334155"/><text x="157" y="224" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="157" dy="0">Заказ</tspan></text><polyline points="760,520 760,480 885,480 885,190" fill="none" stroke="#334155" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#open)"/><circle cx="760" cy="520" r="3.5" fill="white" stroke="#334155"/><text x="920" y="224" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="920" dy="0">Вопрос</tspan></text><polyline points="650,190 650,560 675,560" fill="none" stroke="#334155" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#open)"/><circle cx="650" cy="190" r="3.5" fill="white" stroke="#334155"/><text x="685" y="224" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="685" dy="0">Ответ</tspan></text><polyline points="1295,310 1295,190" fill="none" stroke="#334155" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#open)"/><circle cx="1295" cy="310" r="3.5" fill="white" stroke="#334155"/><text x="1335" y="224" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="1335" dy="0">Сводка</tspan></text><polyline points="1415,190 1415,290 1390,290 1390,310" fill="none" stroke="#334155" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#open)"/><circle cx="1415" cy="190" r="3.5" fill="white" stroke="#334155"/><text x="1505" y="224" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="1505" dy="0">Подтверждение</tspan></text><text x="920" y="1120" font-family="Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#172033"><tspan x="920" dy="0">Основной путь: без печати и ручного ввода. Оператор подключается к исключениям.</tspan></text><text x="920" y="1154" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="920" dy="0">Пунктирная рамка — планируемая интеграция; пунктирная стрелка — сообщение между пулами.</tspan></text></svg>