ll="#172033"><tspan x="1015" dy="0">Импорт каталога / истории из Bitrix</tspan></text><polyline points="1200,740 1165,740 1165,630 1100,630" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="695,790 825,790" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><text x="760" y="770" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="760" dy="0">Outbox</tspan></text><polyline points="825,825 695,825" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><text x="760" y="850" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="760" dy="0">Результат</tspan></text><polyline points="1110,790 1200,790" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><text x="1155" y="773" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="1155" dy="0">HTTPS</tspan></text><polyline points="1355,865 1355,955" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><text x="1430" y="908" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="1430" dy="0">Штатный обмен</tspan></text><polyline points="520,865 520,960" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><text x="611" y="906" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="611" dy="0">Backup / restore</tspan></text><text x="930" y="1010" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="930" dy="0">Пунктирная рамка компонента:</tspan><tspan x="930" dy="20.48">предстоит реализовать.</tspan><tspan x="930" dy="20.48">Полные логи доступны ограниченно;</tspan><tspan x="930" dy="20.48">ключи API находятся в окружении.</tspan></text></svg