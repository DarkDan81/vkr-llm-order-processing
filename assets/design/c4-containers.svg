<svg xmlns="http://www.w3.org/2000/svg" width="1550" height="1110" viewBox="0 0 1550 1110" role="img"><title>C4: контейнеры целевой системы обработки заказов</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#334155"/></marker><marker id="open" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1550" height="1110" fill="white"/><text x="775.0" y="36" font-family="Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle" fill="#172033"><tspan x="775.0" dy="0">C4: контейнеры целевой системы обработки заказов</tspan></text><rect x="305" y="260" width="845" height="655" rx="0" fill="#f8fafc" stroke="#64748b" stroke-width="1.6" stroke-dasharray="8 5"/><text x="330" y="287" font-family="Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#172033"><tspan x="330" dy="0">Граница системы обработки заказов</tspan></text><rect x="30" y="95" width="240" height="115" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.6"/><text x="150.0" y="122" font-family="Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#172033"><tspan x="150.0" dy="0">Клиент</tspan></text><text x="150.0" y="146" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="150.0" dy="0">[Человек]</tspan></text><text x="150.0" y="173" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="150.0" dy="0">Заказ и подтверждение</tspan></text><rect x="350" y="95" width="330" height="115" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.6"/><text x="515.0" y="122" font-family="Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#172033"><tspan x="515.0" dy="0">Telegram</tspan></text><text x="515.0" y="146" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="515.0" dy="0">[Внешняя система]</tspan></text><text x="515.0" y="173" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="515.0" dy="0">Bot API / HTTPS</tspan></text><rect x="770" y="95" width="310" height="115" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.6"/><text x="925.0" y="122" font-family="Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#172033"><tspan x="925.0" dy="0">Оператор / администратор</tspan></text><text x="925.0" y="146" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="925.0" dy="0">[Человек]</tspan></text><text x="925.0" y="173" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="925.0" dy="0">Исключения / обслуживание</tspan></text><rect x="350" y="335" width="420" height="180" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/><text x="560.0" y="362" font-family="Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#172033"><tspan x="560.0" dy="0">Сервис бота</tspan></text><text x="560.0" y="386" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="560.0" dy="0">[Контейнер: Python]</tspan></text><text x="560.0" y="413" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="560.0" dy="0">Telegram-адаптер; LLM-интерпретатор</tspan><tspan x="560.0" dy="20.48">Гибридный поиск; сервис заказа</tspan><tspan x="560.0" dy="20.48">Проверка прав, полей и версии</tspan><tspan x="560.0" dy="20.48">Кэш, пакетные запросы; локальный E5</tspan></text><rect x="1200" y="330" width="310" height="150" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.6"/><text x="1355.0" y="357" font-family="Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#172033"><tspan x="1355.0" dy="0">Модели через API</tspan></text><text x="1355.0" y="381" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="1355.0" dy="0">[Внешняя система]</tspan></text><text x="1355.0" y="408" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="1355.0" dy="0">LLM: Qwen Plus</tspan><tspan x="1355.0" dy="20.48">Эмбеддинги: Perplexity</tspan><tspan x="1355.0" dy="20.48">HTTPS / JSON</tspan></text><rect x="350" y="700" width="345" height="165" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/><text x="522.5" y="727" font-family="Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#172033"><tspan x="522.5" dy="0">Хранилище</tspan></text><text x="522.5" y="751" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="522.5" dy="0">[Контейнер: SQLite]</tspan></text><text x="522.5" y="778" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="522.5" dy="0">Каталог, клиенты и история</tspan><tspan x="522.5" dy="20.48">Заказы, версии и audit</tspan><tspan x="522.5" dy="20.48">Outbox (план)</tspan></text><rect x="825" y="700" width="285" height="165" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6" stroke-dasharray="8 5"/><text x="967.5" y="727" font-family="Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#172033"><tspan x="967.5" dy="0">Worker передачи (план)</tspan></text><text x="967.5" y="751" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="967.5" dy="0">[Контейнер: Python]</tspan></text><text x="967.5" y="778" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="967.5" dy="0">Читает задачи outbox</tspan><tspan x="967.5" dy="20.48">Повтор с тем же ключом</tspan><tspan x="967.5" dy="20.48">Сохраняет внешний ID</tspan></text><rect x="1200" y="700" width="310" height="165" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.6"/><text x="1355.0" y="727" font-family="Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#172033"><tspan x="1355.0" dy="0">Bitrix</tspan></text><text x="1355.0" y="751" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="1355.0" dy="0">[Внешняя система]</tspan></text><text x="1355.0" y="778" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="1355.0" dy="0">Каталог и история</tspan><tspan x="1355.0" dy="20.48">Endpoint заказа (план)</tspan><tspan x="1355.0" dy="20.48">Дедупликация по ключу</tspan></text><rect x="1200" y="955" width="310" height="115" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.6"/><text x="1355.0" y="982" font-family="Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#172033"><tspan x="1355.0" dy="0">1С</tspan></text><text x="1355.0" y="1006" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="1355.0" dy="0">[Внешняя система]</tspan></text><text x="1355.0" y="1033" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#172033"><tspan x="1355.0" dy="0">Существующий учётный контур</tspan></text><rect x="350" y="960" width="430" height="110" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6" stroke-dasharray="8 5"/><text x="565.0" y="987" font-family="Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#172033"><tspan x="565.0" dy="0">Резервная копия (целевой режим)</tspan></text><text x="565.0" y="1011" font-family="Arial, sans-serif" font-size="15" font-weight="400" t